spring.application.name=springboot_rest

logging.level.root = info

logging.level.com.hexaware.springboot.rest.controller = trace

logging.pattern.console=%clr(%d{yyyy-MM-dd}){red} %clr([%level]){blue}  %C %m%n 

# file auto generated with below name extension should be ".log"  --> refresh project to see file updates
logging.file.name = employees_log_file.log


#for file pattern
#logging.pattern.file= %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){green} [%level] %c{1.} [%t] %m%n

logging.pattern.file= [%level]  :  %m%n